[project]
name = "fp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jemuel Banag", email = "banagjemueld@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.0",
    "pydantic[email]>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
]

[project.scripts]
fp = "fp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
